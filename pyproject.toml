[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-extract"
version = "0.1.0"
description = "Schema-validated LLM extraction with error-guided repair and a field-level eval harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rana Taj" }]
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
packages = ["llm_extract"]

[tool.ruff]
line-length = 100
